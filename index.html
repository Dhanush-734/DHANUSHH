<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dhanush - Aspiring Data Engineer & Cloud Enthusiast. Neo-Brutalist Comic Portfolio featuring data pipelines, distributed systems, and real-time analytics." />
    <meta name="theme-color" content="#ffd84d" />

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800;900&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          // Always ensure the website opens in Light Mode first when the link is opened
          localStorage.removeItem('dhanush_theme');
          sessionStorage.removeItem('dhanush_theme');
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#fcf9f8] text-[#1c1b1b] dark:bg-[#101114] dark:text-[#F5F1E8] antialiased selection:bg-[#ffd84d] selection:text-[#1c1b1b] dark:selection:bg-[#FFD43B] dark:selection:text-[#101114]">
